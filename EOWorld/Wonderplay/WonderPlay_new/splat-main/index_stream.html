<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<title>WebGL Gaussian Splat Viewer</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<style>
			body {
				overflow: hidden;
				margin: 0;
				height: 100vh;
				width: 100vw;
				font-family: sans-serif;
				background: rgb(255, 255, 255);
			}
			a, body {
				color: rgb(0, 0, 0);
			}
			#prompt-box {
				position: absolute;
				top: 10px;
				left: 130px;
				z-index: 10;

				border: 2px solid #ccc;
				border-radius: 5px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
			}
			#send-button {
				position: absolute;
				top: 10px;
				left: 10px;
				z-index: 10;

				background-color: #007bff;
				color: white;
				border: 2px solid #ccc;
				border-radius: 5px;
				cursor: pointer;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
				transition: background-color 0.3s;
			}
			#info {
				z-index: 100;
				position: absolute;
				top: 10px;
				left: 15px;
			}
			h3 {
				margin: 5px 0;
			}
			p {
				margin: 5px 0;
				font-size: small;
			}

			.cube-wrapper {
				transform-style: preserve-3d;
			}

			.cube {
				transform-style: preserve-3d;
				transform: rotateX(45deg) rotateZ(45deg);
				animation: rotation 2s infinite;
			}

			.cube-faces {
				transform-style: preserve-3d;
				height: 80px;
				width: 80px;
				position: relative;
				transform-origin: 0 0;
				transform: translateX(0) translateY(0) translateZ(-40px);
			}

			.cube-face {
				position: absolute;
				inset: 0;
				background: #0017ff;
				border: solid 1px #ffffff;
			}
			.cube-face.top {
				transform: translateZ(80px);
			}
			.cube-face.front {
				transform-origin: 0 50%;
				transform: rotateY(-90deg);
			}
			.cube-face.back {
				transform-origin: 0 50%;
				transform: rotateY(-90deg) translateZ(-80px);
			}
			.cube-face.right {
				transform-origin: 50% 0;
				transform: rotateX(-90deg) translateY(-80px);
			}
			.cube-face.left {
				transform-origin: 50% 0;
				transform: rotateX(-90deg) translateY(-80px) translateZ(80px);
			}

			@keyframes rotation {
				0% {
					transform: rotateX(45deg) rotateY(0) rotateZ(45deg);
					animation-timing-function: cubic-bezier(
						0.17,
						0.84,
						0.44,
						1
					);
				}
				50% {
					transform: rotateX(45deg) rotateY(0) rotateZ(225deg);
					animation-timing-function: cubic-bezier(
						0.76,
						0.05,
						0.86,
						0.06
					);
				}
				100% {
					transform: rotateX(45deg) rotateY(0) rotateZ(405deg);
					animation-timing-function: cubic-bezier(
						0.17,
						0.84,
						0.44,
						1
					);
				}
			}

			.scene,
			#message {
				position: absolute;
				display: flex;
				top: 0;
				right: 0;
				left: 0;
				bottom: 0;
				z-index: 2;
				height: 100%;
				width: 100%;
				align-items: center;
				justify-content: center;
			}
			#message {
				font-weight: bold;
				font-size: large;
				color: red;
				pointer-events: none;
			}

			details {
				font-size: small;

			}
			#progress {
				position: absolute;
				top: 0;
				height: 5px;
				background: blue;
				z-index: 99;
				transition: width 0.1s ease-in-out;
			}

			#quality {
				position: absolute;
				bottom: 10px;
				z-index: 999;
				right: 10px;
			}

			#server-state {
				position: absolute;
				bottom: 190px;
				z-index: 999;
				left: 10px;
			}

			#caminfo {
				position: absolute;
				top: 10px;
				z-index: 999;
				right: 10px;
			}
			#annotation-image,
			#canvas {
				display: block;
				position: absolute;
				top: 40px;
				left: 20px;
				width: 512px;
				height: 512px;
				object-fit: contain;
				/*width: 90%;
				height: 90%; */
				touch-action: none;
                border: 3px solid black;
			}
			#annotation-image {
				z-index: 1;
				background: #fff;
			}
			#canvas {
				z-index: 2;
			}
			#canvas-viz {
				display: block;
				position: absolute;
				top: 40px;
				/*left: 532px;*/
				left: 600px;

				/*width: 90%;
				height: 90%; */
				touch-action: none;
                border: 3px solid black;
			}

			#instructions {
				background: rgba(0,0,0,0.6);
				white-space: pre-wrap;
				padding: 10px;
				border-radius: 10px;
				font-size: x-small;
			}
			#motion-overlay {
				display: block;
				position: absolute;
				top: 40px;
				left: 20px;
				z-index: 6;
				touch-action: none;
				pointer-events: none;
			}
			#control-panel {
				position: fixed;
				top: 12px;
				right: 12px;
				z-index: 20;
				width: 272px;
				padding: 10px;
				border: 1px solid #b8c2cc;
				border-radius: 6px;
				background: rgba(255, 255, 255, 0.94);
				box-shadow: 0 3px 12px rgba(0, 0, 0, 0.16);
			}
			#control-panel #prompt-box,
			#control-panel #send-button {
				position: static;
				top: auto;
				left: auto;
				z-index: auto;
				box-shadow: none;
			}
			.control-row {
				display: flex;
				gap: 6px;
				margin-bottom: 7px;
			}
			.control-row input[type="text"] {
				min-width: 0;
				flex: 1;
				padding: 6px 7px;
				border: 1px solid #aeb8c2;
				border-radius: 4px;
			}
			.control-row button,
			.button-grid button {
				padding: 6px 8px;
				border: 1px solid #8c99a5;
				border-radius: 4px;
				background: #f8fafc;
				color: #18212b;
				cursor: pointer;
			}
			.control-row button:hover,
			.button-grid button:hover {
				background: #e6eef5;
			}
			.button-grid {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 6px;
				margin-bottom: 8px;
			}
			.control-label {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 12px;
				margin: 6px 0;
			}
			#motion-scale {
				width: 100%;
			}
			#motion-overlay.enabled {
				cursor: crosshair;
			}
			#caminfo {
				top: 250px;
			}
			@media (max-width: 850px) {
				#control-panel {
					left: 8px;
					right: 8px;
					width: auto;
				}
				#annotation-image, #canvas, #motion-overlay {
					top: 245px;
					left: max(8px, calc((100vw - 512px) / 2));
				}
				#canvas-viz {
					display: none;
				}
			}
			body.nohf .nohf {
				display: none;
			}
			body.nohf #progress, body.nohf .cube-face {
				background: #ff9d0d;
			}
		</style>
	</head>
	<body>
		<script>
			if(location.host.includes('hf.space')) document.body.classList.add('nohf');
		</script>

			<div id="control-panel">
				<div class="control-row">
					<input type="text" id="prompt-box" placeholder="Scene prompt" aria-label="Scene prompt">
					<button id="send-button" title="Update the next scene prompt">Update</button>
				</div>
				<div class="button-grid">
					<button id="start-button" title="Confirm the current selection or motion annotations">Confirm</button>
					<button id="generate-button" title="Expand the scene at the current camera pose">Generate</button>
					<button id="undo-button" title="Undo the latest selection point or expansion">Undo</button>
					<button id="save-button" title="Save the Gaussian scene and motion model">Save</button>
					<button id="fill-button" title="Generate while preserving the sky">Fill</button>
					<button id="delete-button" title="Delete points visible from the current view">Delete</button>
				</div>
				<label class="control-label"><input type="checkbox" id="motion-toggle"> Motion annotation</label>
				<div class="control-row">
					<input type="text" id="sam-prompt" value="water" placeholder="Motion region" aria-label="Motion region text prompt">
					<button id="sam-prompt-button" title="Set the SAM3 region text prompt">Set mask</button>
				</div>
				<div class="button-grid">
					<button id="clear-motion-button" title="Clear the current selection or motion arrows">Clear</button>
					<button id="capture-button" title="Begin recording the dynamic render">Record</button>
					<button id="stop-button" title="Stop recording and write an MP4">Stop</button>
				</div>
				<label class="control-label" for="motion-scale">Motion strength <output id="motion-scale-value">10</output></label>
				<input id="motion-scale" type="range" min="0" max="100" step="1" value="10" aria-label="Motion strength">
			</div>

		<div id="progress"></div>

		<div id="message"></div>
        
			<img id="annotation-image" src="/annotation-frame.png" width="512" height="512" alt="Current input image">
			<canvas id="canvas" width="512" height="512"></canvas>
			<canvas id="motion-overlay" width="512" height="512" aria-label="Motion arrow annotation canvas"></canvas>
		<canvas id="canvas-viz" width="768" height="256"></canvas>

		<div id="quality">
			<span id="fps"></span>
		</div>
		<div id="server-state">
			<span id="server-connect"></span>
		</div>
		<div id="caminfo">
			<span id="iter-number"></span>
			<br>
			<span id="camid"></span>
			<br>
			<span id="focal-x"></span>
			<br>
			<span id="focal-y"></span>
			<br>
			<span id="inner-width"></span>
			<br>
			<span id="inner-height"></span>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.js"></script>
		<script src="main_stream.js?v=20260910-object-selection-v1"></script>
	</body>
</html>
